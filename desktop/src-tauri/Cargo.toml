[package]
name = "tokenledger"
version = "0.1.0"
description = "本机 Coding AI 工具的 Token 账本"
authors = ["Daidai-star"]
edition = "2021"
rust-version = "1.77"

# 只有薄壳：找端口、拉后端、等健康、开 WebView、退出收进程
# 所有统计逻辑都在随包分发的 Node 后端里
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
