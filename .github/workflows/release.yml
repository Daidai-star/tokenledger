name: Release

# 打 tag 才出包：v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（需已存在）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 三个平台并行构建。macOS Intel runner 已下线，x86_64 走交叉编译。
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            ext: dmg
          - label: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            ext: dmg
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # 必须显式带 --target，否则产物落在 target/release/ 而不是
            # target/x86_64-pc-windows-msvc/release/，与上面的上传路径对不上
            args: "--target x86_64-pc-windows-msvc"
            ext: msi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 打包 MSI / NSIS 需要的 WiX v3 与 NSIS 由 tauri-bundler 自行下载
      # 到 AppData，runner 无需预装；WebView2 runtime 在 windows-latest 上已预装。
      # 所以这里刻意不装任何系统包 —— 之前写的 choco install windows-tauri
      # 是个不存在的包名，直接 404（v0.1.0 首次构建即因此失败）。

      # 交叉编译到 x86_64 必需：runner 本身只有 arm64 的 target。
      # 少了这一步，`tauri build --target x86_64-apple-darwin` 会直接失败。
      - name: 安装 Rust target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: 测试
        run: npm test

      - name: 类型检查
        run: npm run typecheck

      # build-sidecar 要拷 dist/ 里的前端产物，必须先构建
      - name: 构建前端
        run: npm run build

      # sidecar 里塞的是 Node 运行时二进制，必须与目标平台一致。
      # 用 shell 分支而不是表达式三元：GitHub 表达式里的 && || 没有优先级，
      # 在矩阵组合下很容易推出错误的平台。macos-14 是 arm64 runner，
      # 构建 Intel 包时必须显式传 --arch=x64。
      - name: 构建 sidecar（${{ matrix.target }}）
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            PLAT=win32; ARCH=x64
          elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            PLAT=darwin; ARCH=arm64
          else
            PLAT=darwin; ARCH=x64
          fi
          echo "构建 sidecar: $PLAT/$ARCH"
          node scripts/build-sidecar.mjs --platform=$PLAT --arch=$ARCH

      # 显式核对：在 Apple Silicon 的 runner 上顺手构建，sidecar 里就会塞进
      # arm64 的 node，发给 Intel 用户会直接崩溃。这条校验专防这种情况。
      - name: 校验 sidecar 平台正确
        shell: bash
        run: |
          cat desktop/src-tauri/resources/sidecar/rt.json
          if [ "${{ runner.os }}" = "Windows" ]; then
            PLAT=win32; ARCH=x64
          elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            PLAT=darwin; ARCH=arm64
          else
            PLAT=darwin; ARCH=x64
          fi
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("desktop/src-tauri/resources/sidecar/rt.json", "utf8"));
            const want = process.argv[1], wantArch = process.argv[2];
            if (m.platform !== want || m.arch !== wantArch) {
              console.error("sidecar 平台不匹配:", JSON.stringify(m), "应为", want, wantArch);
              process.exit(1);
            }
            console.log("sidecar 平台校验通过:", m.platform, m.arch);
          ' "$PLAT" "$ARCH"

      - name: 构建 Tauri 应用
        run: npx tauri build ${{ matrix.args }} --bundles ${{ matrix.ext == 'dmg' && 'dmg' || 'msi,nsis' }}

      # 分平台上传：之前三个平台的 glob 全列在一起，
      # upload-artifact 的 if-no-files-found: error 是「所有 pattern 都没命中
      # 才报错」，所以 Windows 上必然因为找不到 *.dmg 而失败 ——
      # 哪怕 msi 和 exe 都好好地产出来了。
      - name: 上传产物（macOS）
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tokenledger-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: 上传产物（Windows）
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tokenledger-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: find artifacts -type f -exec ls -lh {} +

      # 这条断言是有血的教训：之前 files: artifacts/* 只匹配顶层，
      # 而 upload-artifact 保留了 msi/ nsis/ 子目录结构，于是 Windows 的
      # 安装包被静默漏掉，job 却显示成功，发出了一个只有 macOS 的 Release。
      # 少一个平台会让用户直接下载失败，所以这里显式校验四个安装包都在。
      - name: 校验安装包齐全
        run: |
          set -euo pipefail
          missing=0
          for pat in '*.dmg' '*.msi' '*-setup.exe'; do
            count=$(find artifacts -type f -name "$pat" | wc -l | tr -d ' ')
            echo "$pat -> $count 个"
            if [ "$count" -eq 0 ]; then
              echo "::error::缺少 $pat 安装包"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "产物不完整，拒绝发布半成品 Release"
            exit 1
          fi
          echo "安装包齐全"

      - name: 生成说明
        run: |
          cat > notes.md <<'EOF'
          ## TokenLedger ${{ github.ref_name }}

          统计本机 Codex / Claude Code / OpenCode / DSH / Gemini CLI 的模型用量。

          - 只读本机日志，不发起任何网络请求
          - 三平台：macOS (Apple Silicon / Intel) · Windows (x64)

          下载对应平台的安装包即可。安装后首次启动会自动扫描本机日志。

          > 未签名。首次打开 macOS 版需在「系统设置 → 隐私与安全性」中放行。
          EOF
          cat notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          # 必须用 ** 而不是 *：upload-artifact 保留了各平台的子目录结构
          # （Windows 的装在 artifacts/msi/ 与 artifacts/nsis/ 下），
          # 单层通配符匹配不到它们，会静默漏发 Windows 安装包。
          files: artifacts/**
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
